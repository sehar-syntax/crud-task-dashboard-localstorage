<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen's Protocol: CRUD Task Manager</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .dashboard { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 400px; border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; outline: none; transition: all 0.3s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        button.add-btn { padding: 12px 20px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.add-btn:hover { box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); transform: scale(1.02); }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; transition: 0.3s; }
        li:hover { transform: translateX(3px); }
        .task-text { flex: 1; cursor: pointer; transition: 0.3s; }
        .completed { text-decoration: line-through; color: #64748b; }
        .delete-btn { background: #f87171; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .delete-btn:hover { background: #ef4444; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>Task Dashboard</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a high-impact task...">
        <button class="add-btn" id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
